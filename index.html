>
<style>
:root{
  --red:#ED1D24; --red-ink:#B3141A; --red-tint:#FCEBEC;
  --ink:#231F20; --ink-2:#47423F; --muted:#6F6A68; --faint:#9C9896;
  --line:#E2E2E6; --line-2:#EEEEF1; --silver:#DFE0E4; --canvas:#F4F4F6; --surface:#FFFFFF; --hover:#F8F8FA;
  --green:#1D7447; --green-tint:#E3F2E9; --green-bar:#2E8B57;
  --amber:#925600; --amber-tint:#FBEFD9;
  --blue:#1D58A3; --blue-tint:#E5EDF8;
  --grey-tint:#EEEEF1;
  --font:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --fig:Bahnschrift,"DIN Alternate","Segoe UI",-apple-system,Roboto,Arial,sans-serif;
  --r-panel:10px; --r-ctl:6px;
  --side:264px; --top:64px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 var(--font);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--fig);font-weight:600;margin:0;letter-spacing:0}
.num,.fig{font-family:var(--fig);font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i .f{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover);border-color:#CFCFD4}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#3A3536}
.btn.quiet{border-color:transparent;background:transparent}
.btn.quiet:hover{background:var(--grey-tint)}
.btn.danger{color:var(--red-ink)}
.btn.danger:hover{background:var(--red-tint);border-color:#F2C4C6}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;height:var(--top);display:flex;align-items:center;gap:20px;padding:0 20px 0 22px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--red)}
.brand{display:flex;align-items:center;gap:16px;min-width:0;flex:1}
.brand > a{flex:none;display:block}
.logo{height:40px;width:auto;display:block;flex:none}
.brand-sep{width:1px;height:30px;background:var(--line)}
.brand-txt{min-width:0}
.brand-txt h1{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt p{margin:1px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asof{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.asof input{height:32px;border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 8px;background:var(--surface);font-size:13px;color:var(--ink)}
.asof button{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
.save-state{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.save-state .led{width:7px;height:7px;border-radius:50%;background:var(--green-bar)}
.save-state.dirty .led{background:#D98E04}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(35,31,32,.16);padding:6px;display:none;z-index:50}
.menu.open .menu-pop{display:block}
.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13px;text-align:left;color:var(--ink)}
.menu-pop button:hover{background:var(--hover)}
.menu-pop button svg{color:var(--muted)}
.menu-pop hr{border:0;border-top:1px solid var(--line-2);margin:5px 2px}
.nav-toggle{display:none}

/* ---------- side nav ---------- */
.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--top))}
.side{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px 20px;display:flex;flex-direction:column}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;text-decoration:none;font-size:13.5px;color:var(--ink-2)}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--grey-tint);color:var(--ink);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.nav .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .pc{font-family:var(--fig);font-variant-numeric:tabular-nums;font-size:12px;color:var(--faint)}
.nav-h{display:flex;align-items:center;justify-content:space-between;margin:18px 10px 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.nav-search{margin:0 4px 6px;position:relative}
.nav-search input{width:100%;height:32px;border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 10px 0 30px;font-size:13px;background:var(--canvas)}
.nav-search input:focus{background:var(--surface)}
.nav-search svg{position:absolute;left:9px;top:8px;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.dot.good{background:var(--green-bar)}.dot.info{background:#3B74C2}.dot.warn{background:#D98E04}.dot.bad{background:var(--red)}.dot.muted{background:#C9C9CF}
.side-foot{margin-top:auto;padding:16px 10px 0}
.side-foot .btn{width:100%;justify-content:center}

/* ---------- page ---------- */
main{min-width:0;padding:28px 32px 48px;max-width:1480px}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
.page-head > div:first-child{flex:1;min-width:0}
.page-head h1{font-size:26px;line-height:1.2}
.lede{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px;color:var(--muted);font-size:13.5px}
.meta .sep{width:1px;height:14px;background:var(--line)}
.page-actions{display:flex;gap:8px;flex:none}
.crumb{display:flex;gap:8px;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.notice{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:20px;border:1px solid #EBCB8B;background:var(--amber-tint);border-radius:8px;font-size:13px;color:#5C3A00}
.notice span{flex:1}
.footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

/* sections */
.sect{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);margin-bottom:22px;min-width:0}
.sect-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sect-head h2{font-size:16px}
.sect-head p{margin:0;color:var(--muted);font-size:12.5px;flex-basis:100%;margin-top:-6px}
.sect-head .grow{flex:1}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}

/* brief (overview hero) */
.brief{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);margin-bottom:22px}
.brief-text{padding:22px 26px;border-right:1px solid var(--line)}
.brief-head{font-family:var(--fig);font-size:24px;line-height:1.25;margin:0 0 10px;font-weight:400;color:var(--ink-2)}
.brief-head b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.brief-text p.say{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2);max-width:62ch}
.figs{display:grid;grid-template-columns:1fr 1fr;margin:0}
.figs > div{padding:16px 22px;border-bottom:1px solid var(--line-2)}
.figs > div:nth-child(odd){border-right:1px solid var(--line-2)}
.figs > div:nth-last-child(-n+2){border-bottom:0}
.figs dt{font-size:12.5px;color:var(--muted)}
.figs dd{margin:2px 0 0;font-family:var(--fig);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.figs dd small{font-size:14px;color:var(--muted);font-weight:400}
.figs dd.alert{color:var(--red-ink)}
.meter{display:block;height:5px;background:var(--line-2);border-radius:3px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:3px}
.meter.done i{background:var(--green-bar)}

/* band of figures (project page) */
.band{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.6fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);margin-bottom:22px}
.band > div{padding:15px 20px;border-right:1px solid var(--line-2);min-width:0}
.band > div:last-child{border-right:0}
.band dt{font-size:12.5px;color:var(--muted)}
.band dd{margin:2px 0 0;font-family:var(--fig);font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.band dd small{font-size:13.5px;color:var(--muted);font-weight:400}
.band dd.txt{font-size:17px;padding-top:5px}
.band .sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band dd.alert{color:var(--red-ink)}

/* tabs */
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:0;background:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--hover)}
.tab.on{background:var(--grey-tint);color:var(--ink)}
.tab .ct{font-family:var(--fig);font-weight:400;font-size:12px;color:var(--faint)}
.tab.on .ct{color:var(--muted)}

/* pills + status text */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--grey-tint);color:var(--ink-2)}
.pill.good{background:var(--green-tint);color:var(--green)}
.pill.info{background:var(--blue-tint);color:var(--blue)}
.pill.warn{background:var(--amber-tint);color:var(--amber)}
.pill.bad{background:var(--red-tint);color:var(--red-ink)}
.pill.muted{background:var(--grey-tint);color:var(--muted)}
.stx{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap}
.stx.good{color:var(--green)}.stx.info{color:var(--ink-2)}.stx.warn{color:var(--amber)}.stx.bad{color:var(--red-ink);font-weight:600}.stx.muted{color:var(--faint)}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFBFC}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--hover)}
.tbl tbody tr.click:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.sortb{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.sortb:hover{color:var(--ink)}
.sortb .ar{font-size:10px;opacity:0}
.sortb:hover .ar{opacity:.35}
.sortb.on{color:var(--ink)}.sortb.on .ar{opacity:1}
.t1{font-weight:600;color:var(--ink)}
.t2{font-size:12.5px;color:var(--muted);margin-top:1px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog{display:flex;align-items:center;gap:10px;min-width:150px}
.prog .meter{flex:1;margin:0}
.prog b{font-family:var(--fig);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;min-width:38px;text-align:right}
.dash{color:var(--faint)}
.tbl .num{font-family:var(--fig);font-variant-numeric:tabular-nums;font-size:14px}
.redn{color:var(--red-ink);font-weight:600}
.scroll-x{overflow-x:auto}

/* task table specifics */
.tasks{table-layout:fixed;min-width:1160px}
.tasks td{padding:11px 12px;font-size:13.5px}
.tasks th{padding:10px 12px}
.tasks .grip{width:30px;padding:0 0 0 8px;color:var(--faint);cursor:grab}
.tasks tr.drag td{opacity:.4}
.tasks tr.drop-above td{box-shadow:inset 0 2px 0 var(--ink)}
.tasks tr.drop-below td{box-shadow:inset 0 -2px 0 var(--ink)}
.tasks .dt{font-family:var(--fig);font-variant-numeric:tabular-nums;white-space:nowrap}
.tasks .cm{color:var(--muted);font-size:12.5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{height:32px;width:210px;border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 10px 0 30px;font-size:13px}
.search svg{position:absolute;left:9px;top:8px;color:var(--faint)}
.sel{height:32px;border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 8px;font-size:13px;background:var(--surface)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.list li:last-child{border-bottom:0}
.list li:hover{background:var(--hover)}
.list .tx{flex:1;min-width:0}
.list .tx .t1,.list .tx .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px 0 4px;line-height:1.1}
.date b{display:block;font-family:var(--fig);font-size:18px;font-weight:600}
.date span{font-size:11px;color:var(--muted)}
.date.bad{border-color:#F2C4C6;background:var(--red-tint)}
.date.bad b,.date.bad span{color:var(--red-ink)}

/* ---------- timeline ---------- */
.tl-tools{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden}
.seg button{border:0;background:var(--surface);height:28px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:8px;border-radius:4px;display:inline-block}
.tl-scroll{overflow:auto;max-height:calc(100vh - 260px);border-bottom-left-radius:var(--r-panel);border-bottom-right-radius:var(--r-panel)}
.tl{position:relative}
.tl-row,.tl-head{display:grid;grid-template-columns:280px var(--w)}
.tl-head{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.tl-name{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);padding:0 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.tl-head .tl-name{z-index:5;font-size:12.5px;font-weight:600;color:var(--muted);height:48px}
.tl-scale{position:relative;height:48px}
.tl-scale .mo{position:absolute;top:7px;font-size:12px;font-weight:600;color:var(--ink-2);padding-left:6px;white-space:nowrap}
.tl-scale .wk{position:absolute;bottom:6px;font-family:var(--fig);font-size:11px;color:var(--faint);transform:translateX(-50%)}
.tl-row{height:46px;border-bottom:1px solid var(--line-2);cursor:pointer}
.tl-row:hover .tl-name,.tl-row:hover .tl-track{background:var(--hover)}
.tl-row .tl-name .t1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row .tl-name .t2{font-size:12px;white-space:nowrap}
.tl-track{position:relative}
.tl-grid{position:absolute;top:0;bottom:0;left:280px;pointer-events:none;z-index:1}
.tl-grid .ml{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.tl-grid .today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2}
.tl-scale .td{position:absolute;bottom:4px;transform:translateX(-50%);background:var(--red);color:#fff;font-family:var(--fig);font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap;z-index:1}
.bar{position:absolute;top:16px;height:14px;border-radius:7px;background:#D7D8DE;overflow:hidden;z-index:2}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar.done{background:var(--green-bar)}
.bar.na{background:repeating-linear-gradient(135deg,#E6E6EA 0 4px,#F2F2F4 4px 8px)}
.bar.late{box-shadow:inset 0 0 0 1.5px var(--red)}
.over{position:absolute;top:16px;height:14px;border-radius:0 7px 7px 0;background:repeating-linear-gradient(135deg,rgba(237,29,36,.55) 0 4px,rgba(237,29,36,.18) 4px 8px);z-index:2}
.blab{position:absolute;top:14px;font-size:11.5px;color:var(--muted);font-family:var(--fig);white-space:nowrap;z-index:2}

/* ---------- drawer & modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(35,31,32,.38);z-index:80;opacity:0;transition:opacity .18s}
.scrim.show{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);z-index:81;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(35,31,32,.18);transform:translateX(100%);transition:transform .22s ease}
.drawer.show{transform:none}
.dr-head{display:flex;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dr-head div{flex:1;min-width:0}
.dr-head h2{font-size:18px}
.dr-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.dr-body{flex:1;overflow:auto;padding:18px 22px 24px}
.dr-foot{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:#FBFBFC}
.dr-foot .grow{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld label .opt{font-weight:400;color:var(--faint)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #D6D6DB;border-radius:var(--r-ctl);padding:8px 10px;background:var(--surface);font-size:13.5px}
.fld textarea{resize:vertical;min-height:64px;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(35,31,32,.08)}
.fld .hint{font-size:12px;color:var(--faint);margin-top:4px}
.chk-row{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13.5px;cursor:pointer}
.chk-row input{margin:0}
.fld.err input{border-color:var(--red)}
.fld .msg{display:none;font-size:12px;color:var(--red-ink);margin-top:4px}
.fld.err .msg{display:block}
.rng{display:flex;align-items:center;gap:12px}
.rng input[type=range]{flex:1;padding:0;border:0;accent-color:var(--ink);box-shadow:none}
.rng input[type=number]{width:76px;text-align:right}
.calc{display:flex;gap:22px;padding:12px 14px;background:var(--canvas);border-radius:8px;font-size:12.5px;color:var(--muted)}
.calc b{display:block;color:var(--ink);font-size:13.5px;margin-top:1px}
.fsec{font-size:13px;font-weight:600;color:var(--ink);margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--line-2)}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal > .scrim{z-index:0}
.modal .box{z-index:1;position:relative;background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(35,31,32,.28)}
.modal .box.sm{width:min(430px,100%)}
.modal .dr-body{padding:18px 22px}
.modal .dr-foot{border-bottom-left-radius:12px;border-bottom-right-radius:12px}
.prose p{margin:0 0 10px;line-height:1.6;color:var(--ink-2)}
.prose h3{font-size:14.5px;margin:16px 0 6px}
.prose ul{margin:0 0 10px;padding-left:18px;color:var(--ink-2);line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;z-index:100;transform:translate(-50%,12px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:16px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 10px 30px rgba(35,31,32,.3);transition:.18s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#fff;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
input[type=file]{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1180px){.brief{grid-template-columns:1fr}.brief-text{border-right:0;border-bottom:1px solid var(--line)}.band{grid-template-columns:1fr 1fr 1fr}.band > div{border-bottom:1px solid var(--line-2)}.cols{grid-template-columns:1fr}}
@media (max-width:600px){.asof,.brand-txt{display:none}}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:var(--top);z-index:60;width:280px;transform:translateX(-100%);transition:transform .2s;box-shadow:12px 0 30px rgba(35,31,32,.12)}
  body.nav-open .side{transform:none}
  .nav-toggle{display:inline-flex}
  .asof span,.save-state .tx,.brand-sep,.brand-txt p{display:none}
  main{padding:20px 16px 40px}
  .page-head{flex-direction:column}
  .band{grid-template-columns:1fr 1fr}
  .figs{grid-template-columns:1fr 1fr}
}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top{position:static;box-shadow:inset 0 3px 0 var(--red)}
  .side,.asof button,.save-state,.top .acts,.tools,.page-actions,.notice,.grip,.tl-tools .seg,.side-foot{display:none!important}
  .layout{display:block}main{padding:16px 0;max-width:none}
  .sect,.brief,.band{break-inside:avoid}
  .tl-scroll{max-height:none;overflow:visible}
}

/* ---- sign-in, roles, history (added for the shared version) ---- */
.auth{position:fixed;inset:0;z-index:300;background:var(--canvas);display:flex;align-items:center;justify-content:center;padding:20px}
.auth[hidden],.auth [hidden]{display:none!important}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 32px rgba(35,31,32,.08)}
.auth-card h1{margin:0;font-size:20px;color:var(--ink)}
.auth-card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.auth-msg{min-height:18px;font-size:13px;line-height:1.45;color:var(--red-ink)}
.auth-msg.ok{color:var(--green)}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;font-size:13px;padding:0;text-align:left}
.linkbtn:hover{text-decoration:underline}
.who{font-size:12.5px;color:var(--muted);white-space:nowrap;align-self:center}
[data-act="save"],[data-act="download"],[data-act="import"],[data-act="discard-local"]{display:none!important}
body:not(.role-admin) [data-act="new-project"],body:not(.role-admin) [data-act="edit-project"],body:not(.role-admin) [data-act="settings"]{display:none!important}
body.role-viewer [data-act="add-task"]{display:none!important}
.feed{padding:4px 2px}
.feed-day{margin:16px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.feed-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.feed-t{flex:0 0 64px;color:var(--faint);font-size:12.5px;padding-top:1px}
.chg{margin:4px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.chg li span{display:inline-block;min-width:96px;color:var(--faint)}
@media print{.auth,.who{display:none!important}}
</style>

/* ================= dates ================= */
const DAY = 864e5;

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

const ud = n => new Date(n * DAY);
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmt = n => n == null ? "" : ud(n).getUTCDate() + " " + MON[ud(n).getUTCMonth()] + " " + ud(n).getUTCFullYear();
const fmtS = n => n == null ? "" : ud(n).getUTCDate() + " " + MON[ud(n).getUTCMonth()];
const fmtLong = n => ud(n).getUTCDate() + " " + MONTHS[ud(n).getUTCMonth()] + " " + ud(n).getUTCFullYear();
const reportDay = () => dn(data.reportDate || todayISO());
function expectedDay(txt) {
  if (!txt) return null;
  let m = txt.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s+(\d{4})/i);
  if (m) return Math.round(Date.UTC(+m[2], MON.findIndex(x => x.toLowerCase() === m[1].toLowerCase()) + 1, 0) / DAY);
  m = txt.match(/\bQ([1-4])\s*[-'’]?\s*(\d{4})/i);
  if (m) return Math.round(Date.UTC(+m[2], +m[1] * 3, 0) / DAY);
  m = txt.match(/\d{4}-\d{2}-\d{2}/);
  return m ? dn(m[0]) : null;
}

/* ================= calculations (same rules as the Excel tracker) ================= */
function alertOf(t) {
  if (!t.task) return "";
  if (t.status === "NA") return "Not applicable";
  const due = dn(t.due); if (due == null) return "No due date";
  const p = +t.progress || 0, R = reportDay();
  if (p >= 1) { const c = dn(t.completedOn); return (c != null && c > due) ? "Done late" : "Done on time"; }
  if (R > due) return "Overdue by " + plural(R - due, "day", "days");
  if (R === due) return "Due today";
  if (due - R <= 7) return "Due in " + plural(due - R, "day", "days");
  return "On track";
}
const alertCls = a => a.startsWith("Overdue") || a === "Done late" ? "bad" : a.startsWith("Done") ? "good" : a.startsWith("Due") ? "warn" : a === "On track" ? "info" : "muted";
const isOpen = t => t.task && t.status !== "NA" && (+t.progress || 0) < 1;
function plannedTxt(t) {
  const s = dn(t.start), d = dn(t.due); if (s == null || d == null || d < s) return "";
  const n = d - s + 1; return n < 14 ? plural(n, "day", "days") : (Math.round(n / 7 * 10) / 10) + " weeks";
}
function stats(p) {
  const act = p.tasks.filter(t => t.task && t.status !== "NA"), n = act.length;
  const done = p.tasks.filter(t => t.task && t.status === "Completed").length;
  const inprog = p.tasks.filter(t => t.task && t.status === "In Progress").length;
  const overdue = p.tasks.filter(t => alertOf(t).startsWith("Overdue")).length;
  const progress = n ? act.reduce((a, t) => a + Math.min(1, Math.max(0, +t.progress || 0)), 0) / n : null;
  const implemented = /^\s*implemented/i.test(p.completion || "");
  const exp = expectedDay(p.completion);
  const health = overdue > 0 ? "Overdue tasks" : implemented ? "Implemented" : (exp != null && reportDay() > exp) ? "Past expected date" : n === 0 ? "No tasks yet" : "On track";
  return { n, done, inprog, overdue, progress, implemented, exp, health };
}
const HCLS = { "Overdue tasks": "bad", "Implemented": "good", "Past expected date": "warn", "No tasks yet": "muted", "On track": "info" };
const HORD = { "Overdue tasks": 0, "Past expected date": 1, "On track": 2, "No tasks yet": 3, "Implemented": 4 };
const STATUSES = ["Not Started", "In Progress", "Completed", "On Hold", "NA"];
const SLABEL = { "Not Started": "Not started", "In Progress": "In progress", "Completed": "Completed", "On Hold": "On hold", "NA": "Not applicable", "": "No status" };
const SCLS = { "Not Started": "muted", "In Progress": "info", "Completed": "good", "On Hold": "warn", "NA": "muted", "": "muted" };
const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
const progCell = v => v == null ? '<span class="dash">No tasks</span>' : `<div class="prog"><span class="meter ${v >= 1 ? "done" : ""}"><i style="width:${Math.round(v * 100)}%"></i></span><b>${pct(v)}</b></div>`;
const expectedTxt = p => p.completion || "Not set";

/* ================= persistence: Supabase sync ================= */
/* The page keeps working on the in-memory `data` object exactly as before. After every change, touch() schedules
   a sync that compares `data` with what the server last told us (`known`) and sends only the differences. */
const nz = v => (v === "" || v == null) ? null : v;
const sig = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => a < b ? -1 : 1)) : x);
const taskRow = (t, pos) => ({ task: String(t.task || "").trim(), person: t.person || "", org: t.org || "", objective: t.objective || "", start_date: nz(t.start), due_date: nz(t.due), status: t.status || "Not Started", progress: Math.round((+t.progress || 0) * 1000) / 1000, completed_on: nz(t.completedOn), comments: t.comments || "", position: pos });
const projRow = (p, pos) => ({ short_name: p.short || p.name, name: p.name, focus: p.focus || "", completion: p.completion || "", sort_order: pos });
const fromTask = r => ({ _id: r.id, task: r.task, person: r.person, org: r.org, objective: r.objective, start: r.start_date || "", due: r.due_date || "", status: r.status, progress: Number(r.progress), completedOn: r.completed_on || "", comments: r.comments });
const fromProj = r => ({ id: r.id, name: r.name, short: r.short_name, focus: r.focus, completion: r.completion });
const known = { proj: new Map(), task: new Map(), set: new Map() };   // id -> { v: version, sig, del, pid }
const tSig = r => sig(taskRow(fromTask(r), r.position));
const pSig = r => sig(projRow(fromProj(r), r.sort_order));

async function loadAll() {
  const [pr, mem, st] = await Promise.all([
    sb.from("projects").select("*, tasks(*)").is("deleted_at", null).is("tasks.deleted_at", null).order("sort_order").order("position", { referencedTable: "tasks" }),
    sb.from("project_members").select("project_id").eq("user_id", ME.id),
    sb.from("settings").select("*")
  ]);
  for (const r of [pr, mem, st]) if (r.error) throw r.error;
  ME.member = new Set(mem.data.map(x => x.project_id));
  known.proj.clear(); known.task.clear(); known.set.clear();
  const s = {};
  st.data.forEach(r => { s[r.key] = r.value; known.set.set(r.key, { v: r.version, sig: sig(r.value) }); });
  const next = { title: s.title || EMBED.title, org: Object.assign({}, EMBED.org, s.org || {}), reportDate: data.reportDate || null, updatedAt: new Date().toISOString(), projects: [] };
  pr.data.forEach(r => {
    known.proj.set(r.id, { v: r.version, sig: pSig(r), del: false });
    const p = Object.assign(fromProj(r), { tasks: [] });
    (r.tasks || []).forEach(tr => { known.task.set(tr.id, { v: tr.version, sig: tSig(tr), del: false, pid: r.id }); p.tasks.push(fromTask(tr)); });
    next.projects.push(p);
  });
  data = next; normalise();
}

async function pushChanges() {
  if (ME.role === "viewer") return;
  if (isAdmin()) {                                           // tracker title / organisation
    for (const [key, val] of [["title", data.title], ["org", data.org]]) {
      const k = known.set.get(key); if (k && k.sig === sig(val)) continue;
      const q = k ? sb.from("settings").update({ value: val, version: k.v }).eq("key", key) : sb.from("settings").insert({ key, value: val });
      const { data: r, error } = await q.select().single(); if (error) throw error;
      known.set.set(key, { v: r.version, sig: sig(r.value) });
    }
  }
  const live = new Set();
  for (let i = 0; i < data.projects.length; i++) {
    const p = data.projects[i], row = projRow(p, i + 1);
    if (isAdmin()) {
      const k = known.proj.get(p.id);
      if (!k) {                                              // new project
        const { data: r, error } = await sb.from("projects").insert(row).select().single(); if (error) throw error;
        const old = p.id; p.id = r.id; known.proj.set(r.id, { v: r.version, sig: pSig(r), del: false });
        if (route().id === old) history.replaceState(null, "", "#/p/" + r.id);
      } else if (k.del || k.sig !== sig(row)) {              // edited, re-ordered or restored (undo)
        const patch = Object.assign({}, row, { version: k.v }); if (k.del) patch.deleted_at = null;
        const { data: r, error } = await sb.from("projects").update(patch).eq("id", p.id).select().single(); if (error) throw error;
        known.proj.set(p.id, { v: r.version, sig: pSig(r), del: false });
      }
    }
    live.add(p.id);
    if (!canEdit(p) || !known.proj.has(p.id)) continue;
    const present = new Set();
    for (let j = 0; j < p.tasks.length; j++) {
      const t = p.tasks[j], trow = taskRow(t, j + 1), k = t._id && known.task.get(t._id);
      if (!k) {                                              // new task
        const { data: r, error } = await sb.from("tasks").insert(Object.assign({ project_id: p.id }, trow)).select().single(); if (error) throw error;
        t._id = r.id; known.task.set(r.id, { v: r.version, sig: tSig(r), del: false, pid: p.id });
      } else if (k.del || k.sig !== sig(trow)) {             // edited, re-ordered or restored (undo)
        const patch = Object.assign({}, trow, { version: k.v }); if (k.del) patch.deleted_at = null;
        const { data: r, error } = await sb.from("tasks").update(patch).eq("id", t._id).select().single(); if (error) throw error;
        known.task.set(t._id, { v: r.version, sig: tSig(r), del: false, pid: p.id });
      }
      present.add(t._id);
    }
    for (const [id, k] of [...known.task]) {                 // tasks removed in the UI become soft-deleted rows
      if (k.pid !== p.id || k.del || present.has(id)) continue;
      const { data: r, error } = await sb.from("tasks").update({ deleted_at: new Date().toISOString(), version: k.v }).eq("id", id).select().single(); if (error) throw error;
      known.task.set(id, Object.assign({}, k, { v: r.version, del: true }));
    }
  }
  if (isAdmin()) {
    for (const [id, k] of [...known.proj]) {
      if (k.del || live.has(id)) continue;
      const { data: r, error } = await sb.from("projects").update({ deleted_at: new Date().toISOString(), version: k.v }).eq("id", id).select().single(); if (error) throw error;
      known.proj.set(id, Object.assign({}, k, { v: r.version, del: true }));
    }
  }
}

let syncing = false, syncAgain = false, syncTimer = null, retryTimer = null;
function touch() {
  data.updatedAt = new Date().toISOString();
  dirtyFile = true; lastSaved = "";
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 600);
  paintSaveState();
}
async function syncNow() {
  if (!sb || !ME.id) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; syncState = "saving"; paintSaveState();
  try {
    do { syncAgain = false; await pushChanges(); } while (syncAgain);
    dirtyFile = false; syncState = ""; lastSaved = "All changes saved";
  } catch (e) { await syncError(e); }
  finally { syncing = false; paintSaveState(); }
}
async function recover(msg) {
  try { await loadAll(); dirtyFile = false; syncState = ""; } catch (e) { /* offline: keep what is on screen */ }
  if (route().view === "project" && !curProject()) location.hash = "#/";
  render(); toast(msg);
}
async function syncError(e) {
  const code = (e && e.code) || "", msg = (e && e.message) || String(e);
  console.error("sync failed", e);
  if (code === "PT409") return recover("Someone else changed this at the same time, so your last edit was not saved. You are now seeing the latest data.");
  if (code === "42501" || code === "PGRST116" || /row-level security|permission denied/i.test(msg)) return recover("You do not have permission to make that change, so it was reverted.");
  if (code === "23505") return recover("That short name is already used by another project, so the change was reverted.");
  if (code === "PGRST301" || (e && e.status === 401)) { await sb.auth.signOut(); location.reload(); return; }
  if (/failed to fetch|networkerror|load failed/i.test(msg) || !navigator.onLine) {
    syncState = "offline"; clearTimeout(retryTimer); retryTimer = setTimeout(syncNow, 8000); return;
  }
  return recover("Could not save: " + msg);
}
function paintSaveState() {
  const el = $("#saveState"); if (!el) return;
  el.classList.toggle("dirty", dirtyFile || syncState === "offline");
  $(".tx", el).textContent = syncState === "saving" ? "Saving…" : syncState === "offline" ? "Offline. Will retry" : dirtyFile ? "Saving soon…" : (lastSaved || "All changes saved");
  el.title = "Changes are saved to the shared database automatically.";
}
function saveFile() { return syncNow(); }
function download(text, name, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ================= Excel workbook export (keeps the Gantt/formula template intact) =================
   The exported file is built by editing the raw XML inside tracker-template.xlsx (a zip), not by
   regenerating a spreadsheet from scratch. That keeps every formula, conditional-format rule, data
   bar, merged cell and the Portfolio Overview chart byte-identical to the template; only the task
   data itself is swapped in, and unselected project tabs are removed. */
let _xlsxTemplateBuf = null;
async function loadXlsxTemplate() {
  if (_xlsxTemplateBuf) return _xlsxTemplateBuf;
  const res = await fetch("tracker-template.xlsx");
  if (!res.ok) throw new Error("tracker-template.xlsx not found (HTTP " + res.status + ")");
  _xlsxTemplateBuf = await res.arrayBuffer();
  return _xlsxTemplateBuf;
}

function xlExcelSerial(iso) {
  if (!iso) return null;
  const parts = String(iso).split("-").map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  if (!y || !m || !d) return null;
  const utcDate = Date.UTC(y, m - 1, d);
  const epoch = Date.UTC(1899, 11, 30);
  return Math.round((utcDate - epoch) / 86400000);
}
function xlEscape(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function xlColNum(letters) { let n = 0; for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }

// Rewrites one or more cells within a single <row r="rowNum">...</row> block, preserving every
// other cell verbatim (formulas, styles, shared-formula anchors). Inserts a cell where none
// existed before, since template rows beyond the original task count are sparse.
function xlSetRowCells(xml, rowNum, updates) {
  const rowRe = new RegExp('(<row r="' + rowNum + '"[^>]*>)([\\s\\S]*?)(</row>)');
  const m = xml.match(rowRe);
  if (!m) return xml;
  const [whole, openTag, body, closeTag] = m;
  const cellRe = /<c r="([A-Z]+)\d+"[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g;
  const cells = {};
  let cm;
  while ((cm = cellRe.exec(body))) cells[cm[1]] = cm[0];
  Object.keys(updates).forEach(col => {
    const upd = updates[col];
    const existingFull = cells[col];
    let sAttr = "";
    if (existingFull) { const sMatch = existingFull.match(/\ss="(\d+)"/); if (sMatch) sAttr = ' s="' + sMatch[1] + '"'; }
    const ref = col + rowNum;
    let newCellXml;
    if (upd.type === "text") {
      newCellXml = (upd.value === "" || upd.value == null) ? `<c r="${ref}"${sAttr}/>`
        : `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xlEscape(upd.value)}</t></is></c>`;
    } else {
      newCellXml = (upd.value === "" || upd.value == null || Number.isNaN(upd.value)) ? `<c r="${ref}"${sAttr}/>`
        : `<c r="${ref}"${sAttr}><v>${upd.value}</v></c>`;
    }
    cells[col] = newCellXml;
  });
  const colsSorted = Object.keys(cells).sort((a, b) => xlColNum(a) - xlColNum(b));
  const newBody = colsSorted.map(c => cells[c]).join("");
  return xml.slice(0, m.index) + openTag + newBody + closeTag + xml.slice(m.index + whole.length);
}

const XL_MAX_TASK_ROWS = 40; // template rows 10..49
function xlPatchProjectSheet(xml, project) {
  xml = xlSetRowCells(xml, 2, { B: { type: "text", value: project.name } });
  xml = xlSetRowCells(xml, 6, { B: { type: "text", value: project.completion || "" }, D: { type: "text", value: project.focus || "" } });
  const tasks = (project.tasks || []).filter(t => t.task).slice(0, XL_MAX_TASK_ROWS);
  for (let i = 0; i < XL_MAX_TASK_ROWS; i++) {
    const row = 10 + i, t = tasks[i];
    xml = xlSetRowCells(xml, row, {
      C: { type: "text", value: t ? t.task : "" },
      D: { type: "text", value: t ? t.person : "" },
      E: { type: "text", value: t ? t.org : "" },
      F: { type: "text", value: t ? t.objective : "" },
      G: { type: "num", value: t ? xlExcelSerial(t.start) : null },
      H: { type: "num", value: t ? xlExcelSerial(t.due) : null },
      J: { type: "text", value: t ? t.status : "" },
      K: { type: "num", value: t ? (t.progress == null ? 0 : +t.progress) : null },
      L: { type: "num", value: t ? xlExcelSerial(t.completedOn) : null },
      N: { type: "text", value: t ? (t.comments || "") : "" },
    });
  }
  return xml;
}

async function buildTrackerExcel(templateArrayBuffer, allProjects, selectedShorts) {
  const zip = await JSZip.loadAsync(templateArrayBuffer);
  const domParser = new DOMParser(), xmlSer = new XMLSerializer();
  const nsMain = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const nsRel = "http://schemas.openxmlformats.org/package/2006/relationships";
  const nsOfficeRel = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const nsCT = "http://schemas.openxmlformats.org/package/2006/content-types";

  const wbDoc = domParser.parseFromString(await zip.file("xl/workbook.xml").async("string"), "application/xml");
  const relsDoc = domParser.parseFromString(await zip.file("xl/_rels/workbook.xml.rels").async("string"), "application/xml");
  const ctDoc = domParser.parseFromString(await zip.file("[Content_Types].xml").async("string"), "application/xml");

  const sheetEls = Array.from(wbDoc.getElementsByTagNameNS(nsMain, "sheet"));
  const relEls = Array.from(relsDoc.getElementsByTagNameNS(nsRel, "Relationship"));
  const relById = {}; relEls.forEach(r => { relById[r.getAttribute("Id")] = r; });

  const includeOverview = selectedShorts.length === allProjects.length;
  const keepNames = new Set(selectedShorts);
  if (includeOverview) keepNames.add("Portfolio Overview");

  const removedTargets = [];
  sheetEls.forEach(sheetEl => {
    const name = sheetEl.getAttribute("name");
    if (!keepNames.has(name)) {
      const rId = sheetEl.getAttributeNS(nsOfficeRel, "id");
      const relEl = relById[rId];
      if (relEl) { removedTargets.push(relEl.getAttribute("Target")); relEl.parentNode.removeChild(relEl); }
      sheetEl.parentNode.removeChild(sheetEl);
    }
  });

  // Print-area/print-titles definedNames are keyed to sheet position, which shifts when sheets
  // are removed; dropping them entirely is safe (only affects print layout) and avoids corrupting indices.
  Array.from(wbDoc.getElementsByTagNameNS(nsMain, "definedNames")).forEach(el => el.parentNode.removeChild(el));

  const calcPr = wbDoc.getElementsByTagNameNS(nsMain, "calcPr")[0];
  if (calcPr) calcPr.setAttribute("fullCalcOnLoad", "1"); // force recalculation against the new data on open

  const calcChainRel = relEls.find(r => r.getAttribute("Target") === "calcChain.xml");
  if (calcChainRel) { removedTargets.push("calcChain.xml"); calcChainRel.parentNode.removeChild(calcChainRel); }

  if (!includeOverview) {
    removedTargets.push("worksheets/_rels/sheet1.xml.rels", "drawings/drawing1.xml", "drawings/_rels/drawing1.xml.rels", "charts/chart1.xml");
  }

  removedTargets.forEach(target => { const path = "xl/" + target.replace(/^\/?/, ""); if (zip.file(path)) zip.remove(path); });
  Array.from(ctDoc.getElementsByTagNameNS(nsCT, "Override")).forEach(ov => {
    const pn = ov.getAttribute("PartName");
    if (removedTargets.some(t => pn === "/xl/" + t.replace(/^\/?/, ""))) ov.parentNode.removeChild(ov);
  });

  zip.file("xl/workbook.xml", xmlSer.serializeToString(wbDoc));
  zip.file("xl/_rels/workbook.xml.rels", xmlSer.serializeToString(relsDoc));
  zip.file("[Content_Types].xml", xmlSer.serializeToString(ctDoc));

  const projByShort = {}; allProjects.forEach(p => { projByShort[p.short] = p; });
  for (const sheetEl of Array.from(wbDoc.getElementsByTagNameNS(nsMain, "sheet"))) {
    const name = sheetEl.getAttribute("name");
    if (name === "Portfolio Overview") continue; // left byte-identical, including its chart
    const proj = projByShort[name];
    if (!proj) continue;
    const rId = sheetEl.getAttributeNS(nsOfficeRel, "id");
    const relEl = relById[rId];
    const target = "xl/" + relEl.getAttribute("Target").replace(/^\/?/, "");
    let sheetXml = await zip.file(target).async("string");
    sheetXml = xlPatchProjectSheet(sheetXml, proj);
    zip.file(target, sheetXml);
  }

  return zip.generateAsync({ type: "blob", compression: "DEFLATE" });
}

/* ================= change history ================= */
const FIELD = { task: "Task", person: "Key person", org: "Org / dept", objective: "Objective", start_date: "Start date", due_date: "Due date", status: "Status", progress: "Progress", completed_on: "Completed on", comments: "Comments", name: "Name", short_name: "Short name", focus: "Focus", completion: "Expected completion", role: "Role", active: "Active", full_name: "Name", value: "Value" };
function fmtVal(k, v) {
  if (v == null || v === "") return "empty";
  if (k === "progress") return Math.round(v * 100) + "%";
  if ((/_date$/.test(k) || k === "completed_on") && /^\d{4}-\d{2}-\d{2}/.test(v)) return fmt(dn(v));
  if (k === "status") return SLABEL[v] || v;
  if (typeof v === "object") return JSON.stringify(v);
  const s = String(v); return s.length > 70 ? s.slice(0, 67) + "…" : s;
}
const personOf = r => (ME.people[r.user_id] && ME.people[r.user_id].name) || r.user_email || "System";
const changesHTML = r => { const l = (r.changed_fields || []).filter(k => k !== "deleted_at").map(k => `<li><span>${esc(FIELD[k] || k)}</span>${esc(fmtVal(k, (r.before_data || {})[k]))} → <b>${esc(fmtVal(k, (r.after_data || {})[k]))}</b></li>`); return l.length ? `<ul class="chg">${l.join("")}</ul>` : ""; };
function describe(r) {
  const a = r.after_data || {}, b = r.before_data || {};
  const del = (r.changed_fields || []).includes("deleted_at");
  if (r.table_name === "tasks") {
    const nm = `<b>${esc(a.task || b.task || "")}</b>`;
    if (r.action === "INSERT") return `added task ${nm}`;
    if (del) return a.deleted_at ? `deleted task ${nm}` : `restored task ${nm}`;
    return `edited task ${nm}` + changesHTML(r);
  }
  if (r.table_name === "projects") {
    const nm = `<b>${esc(a.name || b.name || "")}</b>`;
    if (r.action === "INSERT") return `created project ${nm}`;
    if (del) return a.deleted_at ? `deleted project ${nm}` : `restored project ${nm}`;
    return `edited project ${nm}` + changesHTML(r);
  }
  if (r.table_name === "profiles") return `changed access for <b>${esc(a.email || b.email || "")}</b>` + changesHTML(r);
  if (r.table_name === "project_members") return r.action === "INSERT" ? "added an editor to a project" : "removed an editor from a project";
  if (r.table_name === "settings") return `updated tracker settings` + (r.action === "UPDATE" ? changesHTML(r) : "");
  return esc(r.action.toLowerCase() + " " + r.table_name);
}
function feedHTML(rows) {
  if (!rows.length) return `<p class="t2" style="padding:16px">No changes recorded yet.</p>`;
  let day = "", out = "";
  rows.forEach(r => {
    const d = new Date(r.at), dl = d.toLocaleDateString([], { dateStyle: "medium" });
    if (dl !== day) { day = dl; out += `<h4 class="feed-day">${esc(dl)}</h4>`; }

  });
  return `<div class="feed">${out}</div>`;
}

function renderTimeline(p) {
  const R = reportDay();
  const rows = p.tasks.map((t, i) => ({ t, i })).filter(x => x.t.task);
  const pts = []; rows.forEach(({ t }) => [dn(t.start), dn(t.due)].forEach(v => v != null && pts.push(v)));
  const tools = `<div class="tl-tools"><div class="seg" role="group" aria-label="Scale"><button type="button" class="${ui.scale === "fit" ? "on" : ""}" data-act="scale" data-v="fit">Whole project</button><button type="button" class="${ui.scale === "weeks" ? "on" : ""}" data-act="scale" data-v="weeks">Week by week</button></div>
    <div class="lg"><span><i class="sw" style="background:var(--ink)"></i>Progress</span><span><i class="sw" style="background:#D7D8DE"></i>Remaining</span><span><i class="sw" style="background:var(--green-bar)"></i>Complete</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,rgba(237,29,36,.55) 0 4px,rgba(237,29,36,.18) 4px 8px)"></i>Overdue</span><span><i class="sw" style="width:2px;height:12px;border-radius:0;background:var(--red)"></i>Status date</span></div></div>`;
  if (!pts.length) { $("#tabBody").innerHTML = tools + `<div class="empty"><b>Nothing to plot yet</b>Add start and due dates to tasks to see them on the timeline.</div>`; return; }
  const d0 = Date.UTC(ud(Math.min(...pts, R) - 10).getUTCFullYear(), ud(Math.min(...pts, R) - 10).getUTCMonth(), 1) / DAY;
  const endN = Math.max(...pts, R) + 21; const ed = ud(endN); const d1 = Date.UTC(ed.getUTCFullYear(), ed.getUTCMonth() + 1, 1) / DAY;
  const avail = Math.max(400, $("#tabBody").clientWidth - 284);
  const PX = ui.scale === "weeks" ? 6 : Math.max(1, avail / (d1 - d0));
  const W = Math.round((d1 - d0) * PX), x = n => (n - d0) * PX;
  let months = "", lines = "", weeks = "";
  for (let m = d0; m < d1;) { const dt = ud(m); const nx = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 1) / DAY;
    months += `<span class="mo" style="left:${x(m)}px">${PX * 30 >= 70 ? MON[dt.getUTCMonth()] + " " + dt.getUTCFullYear() : dt.getUTCMonth() === 0 ? MON[0] + " ’" + String(dt.getUTCFullYear()).slice(2) : MON[dt.getUTCMonth()]}</span>`;
    lines += `<i class="ml" style="left:${x(m)}px"></i>`; m = nx; }
  if (PX >= 4) for (let w = d0 - ((d0 + 4) % 7) + 7; w < d1; w += 7) weeks += `<span class="wk" style="left:${x(w)}px">${ud(w).getUTCDate()}</span>`;
  const body = rows.map(({ t, i }) => {
    const S = dn(t.start), D = dn(t.due), v = Math.min(1, +t.progress || 0), a = alertOf(t), late = a.startsWith("Overdue");
    let g = "";
    if (S != null && D != null && D >= S) {
      const L = x(S), Wd = Math.max(PX * 2, (D - S + 1) * PX);
      const cls = t.status === "NA" ? "na" : v >= 1 ? "done" : "";
      g += `<div class="bar ${cls} ${late || a === "Done late" ? "late" : ""}" style="left:${L}px;width:${Wd}px">${cls ? "" : `<i style="width:${v * 100}%"></i>`}</div>`;
      let endX = L + Wd;
      if (late) { const ox = x(D + 1), ow = Math.max(0, x(R + 1) - ox); g += `<div class="over" style="left:${ox}px;width:${ow}px"></div>`; endX = ox + ow; }
      g += `<span class="blab" style="left:${endX + 8}px">${t.status === "NA" ? "N/A" : v >= 1 ? (a === "Done late" ? "Done late" : "Done") : Math.round(v * 100) + "%"}</span>`;
    } else if (D != null) g += `<span class="blab" style="left:${x(D)}px">Due ${fmtS(D)} (no start date)</span>`;
    return `<div class="tl-row" data-task="${i}" tabindex="0" title="${esc(t.task)}: ${fmt(S) || "?"} to ${fmt(D) || "?"}, ${Math.round(v * 100)}%, ${esc(a)}">
      <div class="tl-name"><div class="t1">${esc(t.task)}</div><div class="t2">${S != null ? fmtS(S) : "?"} – ${D != null ? fmt(D) : "?"}</div></div><div class="tl-track">${g}</div></div>`;
  }).join("");
  const inR = R >= d0 && R < d1;
  const todayLine = inR ? `<div class="today" style="left:${x(R) + PX / 2}px"></div>` : "";
  const todayTag = inR ? `<span class="td" style="left:${x(R) + PX / 2}px">${fmtS(R)}</span>` : "";
  $("#tabBody").innerHTML = tools + `<div class="tl-scroll" id="tlScroll"><div class="tl" style="--w:${W}px;width:${280 + W}px">
    <div class="tl-head"><div class="tl-name">Task</div><div class="tl-scale">${months}${weeks}${todayTag}</div></div>
    ${body}<div class="tl-grid" style="width:${W}px">${lines}${todayLine}</div></div></div>`;
  const sc = $("#tlScroll"); if (ui.scale === "weeks") sc.scrollLeft = Math.max(0, x(R) - (sc.clientWidth - 280) * 0.6);
}

/* ================= modals ================= */
function modal({ title, body, foot, size = "", onSubmit }) {
  const wrap = document.createElement("div"); wrap.className = "modal"; wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-modal", "true");
  wrap.innerHTML = `<div class="scrim show" data-act="close-modal"></div><form class="box ${size}" novalidate><div class="dr-head"><div><h2>${title}</h2></div><button class="btn icon quiet" type="button" data-act="close-modal" aria-label="Close">${IC.close}</button></div><div class="dr-body">${body}</div><div class="dr-foot">${foot}</div></form>`;
  const ret = document.activeElement;
  wrap._close = () => { wrap.remove(); if (ret && document.contains(ret)) ret.focus(); };
  $("form", wrap).addEventListener("submit", e => { e.preventDefault(); onSubmit && onSubmit(wrap); });
  document.body.appendChild(wrap);
  setTimeout(() => ($("input,select,textarea,button[type=submit]", $(".dr-body", wrap)) || $("button[type=submit]", wrap) || $("button", wrap))?.focus(), 30);
  return wrap;
}
function confirmBox({ title, text, ok = "Confirm", danger }) {
  return new Promise(res => {
    const m = modal({ title, size: "sm", body: `<p style="margin:0;line-height:1.55;color:var(--ink-2)">${text}</p>`,
      foot: `<span class="grow"></span><button class="btn" type="button" data-act="close-modal">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" type="submit">${ok}</button>`,
      onSubmit: w => { res(true); w._close(); } });
    const orig = m._close; m._close = () => { orig(); res(false); };
    setTimeout(() => $("button[type=submit]", m).focus(), 40);
  });
}

/* ================= events ================= */
async function act(name, el) {
  const p = curProject();
  if (name === "menu") { const m = el.closest(".menu"), was = m.classList.contains("open"); $$(".menu.open").forEach(x => x.classList.remove("open")); if (!was) m.classList.add("open"); return; }
  $$(".menu.open").forEach(m => m.classList.remove("open"));
  switch (name) {
    case "signout": await sb.auth.signOut(); location.reload(); return;
    case "history": return showHistory({ title: "Change history" });
    case "password": return passwordModal();
    case "task-history": { if (!drawer || drawer.isNew) return; const t = drawer.p.tasks[drawer.i]; return showHistory({ title: "History: " + esc(t.task), record: t._id }); }
    case "save": return saveFile(false);
    case "download": return saveFile(true);
    case "csv": return exportCSV();
    case "xlsx-export": return xlsxExportModal();
    case "json": download(JSON.stringify(data, null, 1), "Tracker_backup_" + todayISO() + ".json", "application/json"); return toast("Backup exported");
    case "import": return toast("Restoring from a file is switched off. The data now lives in the shared database.");
    case "print": return window.print();
    case "settings": if (!isAdmin()) return deny("Only admins can change tracker settings."); return settingsModal();
    case "help": return helpModal();
    case "nav-toggle": return document.body.classList.toggle("nav-open");
    case "rd-today": data.reportDate = null; touch(); return render();
    case "undo": if (undoSnap) { data = undoSnap; undoSnap = null; touch(); $("#toast").classList.remove("show"); if (route().view === "project" && !curProject()) location.hash = "#/"; render(); } return;
    case "discard-local":
      if (await confirmBox({ title: "Discard browser changes?", text: "The changes kept in this browser will be removed, and the tracker goes back to what is saved in the file.", ok: "Discard changes", danger: true })) {
        try { localStorage.removeItem(LS_KEY); } catch (e) {} data = clone(EMBED); normalise(); restored = false; dirtyFile = false; render(); toast("Changes discarded"); }
      return;
    case "new-project": if (!isAdmin()) return deny("Only admins can create projects."); return projectModal(null);
    case "edit-project": if (!isAdmin()) return deny("Only admins can edit projects."); return p && projectModal(p);
    case "delete-project": {
      if (!p) return; if (!isAdmin()) return deny("Only admins can delete projects."); const m = el.closest(".modal");
      if (await confirmBox({ title: "Delete this project?", text: `“${esc(p.name)}” and its ${plural(p.tasks.length, "task", "tasks")} will be removed. You can undo this straight after.`, ok: "Delete project", danger: true })) {
        const snap = clone(data); data.projects = data.projects.filter(x => x !== p); m && m._close(); touch(); location.hash = "#/"; toast("Project deleted", snap); }
      return;
    }
    case "add-task": if (!p) return; if (!canEdit(p)) return deny(); return openDrawer(p, -1);
    case "close-drawer": return closeDrawer();
    case "close-modal": { const m = el.closest(".modal"); return m && m._close(); }
    case "drawer-delete": {
      if (!drawer) return; if (!canEdit(drawer.p)) return deny(); const { p: dp, i } = drawer;
      if (await confirmBox({ title: "Delete this task?", text: `“${esc(dp.tasks[i].task)}” will be removed from ${esc(dp.short || dp.name)}. You can undo this straight after.`, ok: "Delete task", danger: true })) {
        const snap = clone(data); dp.tasks.splice(i, 1); touch(); closeDrawer(); render(); toast("Task deleted", snap); }
      return;
    }
    case "ov-filter": ui.ovFilter = el.dataset.v; return renderOverview();
    case "ov-sort": { const k = el.dataset.k; ui.ovSort = { k, d: ui.ovSort.k === k ? -ui.ovSort.d : 1 }; return renderOverview(); }
    case "tab": ui.tab = el.dataset.v; return p && renderProject(p);
    case "scale": ui.scale = el.dataset.v; return p && renderTimeline(p);
  }
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (!e.target.closest(".menu")) $$(".menu.open").forEach(m => m.classList.remove("open"));
  if (a) { e.preventDefault(); act(a.dataset.act, a); return; }
  const go = e.target.closest("[data-go]"); if (go) { location.hash = "#/p/" + go.dataset.go; return; }
  const tr = e.target.closest("[data-task]"); if (tr && curProject()) openDrawer(curProject(), +tr.dataset.task);
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveFile(false); return; }
  if (e.key === "Escape") {
    const m = $$(".modal").pop(); if (m) { m._close(); return; }
    if (drawer) { closeDrawer(); return; }
    $$(".menu.open").forEach(x => x.classList.remove("open")); document.body.classList.remove("nav-open");
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-go],[data-task]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (drawer && drawer.el.contains(el)) return onDrawerInput(e);
  if (el.id === "navSearch") { ui.navQ = el.value; const pos = el.selectionStart; renderNav(); const n = $("#navSearch"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.id === "taskQ") { ui.q = el.value; const p = curProject(); p && renderTasks(p); return; }
  if (el.closest(".modal")) { el.closest(".fld")?.classList.remove("err"); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (drawer && drawer.el.contains(el)) return onDrawerInput(e);
  if (el.id === "reportDate") { data.reportDate = el.value && el.value !== todayISO() ? el.value : null; touch(); return render(); }
  if (el.id === "taskSt") { ui.st = el.value; const p = curProject(); p && renderTasks(p); return; }
  if (el.id === "importFile") { importJSON(el.files[0]); el.value = ""; }
});
document.addEventListener("submit", e => { if (e.target.id === "taskForm") { e.preventDefault(); submitDrawer(); } });

/* drag to reorder tasks */
let dragI = null;
document.addEventListener("dragstart", e => { const tr = e.target.closest && e.target.closest("tr[data-task]"); if (!tr) return; dragI = +tr.dataset.task; tr.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(dragI)); });
document.addEventListener("dragover", e => {
  const tr = e.target.closest && e.target.closest("tr[data-task]"); if (dragI == null || !tr) return;
  e.preventDefault(); $$(".drop-above,.drop-below").forEach(x => x.classList.remove("drop-above", "drop-below"));
  const r = tr.getBoundingClientRect(); tr.classList.add(e.clientY < r.top + r.height / 2 ? "drop-above" : "drop-below");
});
document.addEventListener("drop", e => {
  const tr = e.target.closest && e.target.closest("tr[data-task]"), p = curProject(); if (dragI == null || !tr || !p || !canEdit(p)) return;
  e.preventDefault(); let to = +tr.dataset.task; if (tr.classList.contains("drop-below")) to++;
  const [m] = p.tasks.splice(dragI, 1); if (to > dragI) to--; p.tasks.splice(to, 0, m);
  dragI = null; touch(); renderTasks(p); toast("Task order updated");
});
document.addEventListener("dragend", () => { dragI = null; $$(".drag,.drop-above,.drop-below").forEach(x => x.classList.remove("drag", "drop-above", "drop-below")); });

async function importJSON(file) {
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); if (!obj || !Array.isArray(obj.projects)) throw 0; }
  catch (er) { return toast("That file is not a tracker backup. Choose a .json file exported from this tracker."); }
  if (!(await confirmBox({ title: "Restore from backup?", text: `The current data will be replaced with “${esc(file.name)}” (${plural(obj.projects.length, "project", "projects")}). You can undo this straight after.`, ok: "Restore backup" }))) return;
  const snap = clone(data); obj.fileId = data.fileId; data = obj; normalise(); touch(); location.hash = "#/"; render(); toast("Backup restored", snap);
}
window.addEventListener("beforeunload", e => { if (dirtyFile) { e.preventDefault(); e.returnValue = ""; } });

/* ================= sign-in and start-up ================= */
let started = false, authMode = "password";
const authEl = () => $("#auth");
function showAuth(msg, opts = {}) {
  authEl().hidden = false;
  $("#authForm").hidden = !!opts.blocked; $("#authBlocked").hidden = !opts.blocked;
  const m = $(opts.blocked ? "#authBlockedMsg" : "#authMsg"); m.textContent = msg || ""; m.classList.toggle("ok", !!opts.ok);
}
const hideAuth = () => { authEl().hidden = true; };
function setAuthMode(mode) {
  authMode = mode;
  const signup = mode === "signup";
  $("#au-name-f").hidden = !signup;
  $("#au-pw-f").hidden = mode === "link";
  $("#au-confirm-f").hidden = !signup;
  $("#au-title").textContent = signup ? "Create account" : "Sign in";
  $("#au-sub").textContent = signup ? "Use your work email address." : "Use the email address you were invited with.";
  $("#au-go").textContent = signup ? "Create account" : (mode === "link" ? "Email me a sign-in link" : "Sign in");
  $("#au-link").hidden = signup;
  $("#au-link").textContent = mode === "link" ? "Use my password instead" : "Email me a sign-in link instead";
  $("#au-switch").textContent = signup ? "Already have an account? Sign in" : "New here? Create an account";
  $("#authMsg").textContent = "";
}
$("#au-link").addEventListener("click", () => setAuthMode(authMode === "link" ? "password" : "link"));
$("#au-switch").addEventListener("click", () => setAuthMode(authMode === "signup" ? "password" : "signup"));
$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#au-email").value.trim(), pw = $("#au-pw").value;
  if (!email) return showAuth("Enter your email address.");
  const go = $("#au-go"); go.disabled = true;
  try {
    if (authMode === "link") {
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
      if (error) showAuth("Could not send the link. Please try again in a few minutes."); else showAuth("If that address has access, a sign-in link is on its way. Open it in this browser.", { ok: true });
    } else if (authMode === "signup") {
      const name = $("#au-name").value.trim(), confirm = $("#au-confirm").value;
      if (!pw || pw.length < 10) return showAuth("Choose a password with at least 10 characters.");
      if (pw !== confirm) return showAuth("Passwords don't match.");
      const { data: sdata, error } = await sb.auth.signUp({ email, password: pw, options: { data: { full_name: name } } });
      if (error) {
        showAuth(/registered/i.test(error.message) ? "An account with that email already exists. Sign in instead." : "Could not create the account. Please try again.");
      } else if (!sdata.session) {
        showAuth("Check your inbox to confirm your address, then sign in.", { ok: true });
      }
      // if a session comes back immediately (email confirmation off), onAuthStateChange picks it up and signs the person in
    } else {
      if (!pw) return showAuth("Enter your password.");
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) showAuth("Email or password is incorrect.");
    }
  } finally { go.disabled = false; }
});
$("#authSignOut").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

async function start(session) {
  if (started) return; started = true;
  ME.id = session.user.id; ME.email = session.user.email || "";
  try {
    const { data: prof, error } = await sb.from("profiles").select("*").eq("id", ME.id).maybeSingle();
    if (error) throw error;
    if (!prof) { started = false; return showAuth("Your account has been created but has no access yet. Ask an administrator to set you up.", { blocked: true }); }
    if (!prof.active) { started = false; return showAuth("Your account has been deactivated. Contact an administrator.", { blocked: true }); }
    ME.role = prof.role; ME.name = prof.full_name || ME.email;
    await loadAll();
    const ppl = await sb.from("profiles").select("id,email,full_name");
    (ppl.data || []).forEach(x => { ME.people[x.id] = { name: x.full_name || x.email, email: x.email }; });
  } catch (e) { started = false; console.error(e); return showAuth("Could not load the tracker: " + (e.message || e), { blocked: true }); }
  if (/[?&]code=/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);
  hideAuth();
  document.body.classList.add("role-" + ME.role);
  $("#who").textContent = ME.name + " · " + ME.role;
  render();
}
async function refreshIfIdle() {
  if (!started || dirtyFile || syncing || drawer || $(".modal") || document.hidden) return;
  try { const before = sig(data.projects); await loadAll(); if (sig(data.projects) !== before) render(); } catch (e) { /* try again next time */ }
}
setInterval(refreshIfIdle, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshIfIdle(); });

(async function boot() {
  if (!sb) return showAuth("This site is not connected to a database yet. Add your Supabase URL and anon key to config.js.", { blocked: true });
  sb.auth.onAuthStateChange((ev, s) => { if (ev === "SIGNED_OUT" && started) location.reload(); if (s && !started) start(s); });
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session); else { setAuthMode("password"); showAuth(""); }
})();
</script>
</body>
</html>
